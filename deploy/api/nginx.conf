server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/public;
    index index.php;
    client_max_body_size 12m;

    # Fichiers uploadés (logos opérateurs, drapeaux) : storage/app/public, monté en lecture seule.
    # ^~ empêche toute exécution PHP dans ce dossier.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Seul le front controller est exécuté.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
