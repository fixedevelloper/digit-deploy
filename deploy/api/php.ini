; Surcharges de production (chargées après php.ini-production)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code ne change pas dans un conteneur : pas de vérification des fichiers.
opcache.validate_timestamps = 0
